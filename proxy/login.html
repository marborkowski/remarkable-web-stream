<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>reMarkable Live</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #f3f1ec; color: #1d1d1b;
  }
  @media (prefers-color-scheme: dark) { body { background: #161616; color: #ececec; } }
  form {
    width: min(92vw, 340px); padding: 32px 28px; border-radius: 14px;
    background: rgba(255,255,255,.75); box-shadow: 0 8px 30px rgba(0,0,0,.12);
    backdrop-filter: blur(8px);
  }
  @media (prefers-color-scheme: dark) { form { background: rgba(40,40,40,.85); } }
  h1 { font-size: 1.25rem; margin: 0 0 4px; font-weight: 600; }
  p.sub { margin: 0 0 20px; opacity: .65; font-size: .9rem; }
  input[type=password] {
    width: 100%; box-sizing: border-box; font-size: 1.05rem; padding: 12px 14px;
    border: 1px solid rgba(0,0,0,.2); border-radius: 8px; background: transparent; color: inherit;
  }
  button {
    width: 100%; margin-top: 12px; padding: 12px; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 8px; background: #1d1d1b; color: #fff; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { background: #ececec; color: #161616; } }
  .err { color: #c0392b; font-size: .9rem; margin: 0 0 12px; }
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="off">
  <h1>reMarkable Live</h1>
  <p class="sub">Podaj hasło, aby zobaczyć ekran na żywo.</p>
  {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
  <input type="password" name="password" placeholder="Hasło" autofocus required>
  <button type="submit">Wejdź</button>
</form>
</body>
</html>
