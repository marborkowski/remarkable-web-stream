name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proxy:
    name: Proxy (vet, test, cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: proxy/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l proxy tools)"
      - name: Vet and test
        run: make test
      - name: Cross-compile for arm and arm64
        run: make build

  gms:
    name: goMarkableStream patches apply and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Apply patches and build
        run: make gms
      - name: Upstream stream tests with patches
        run: cd dist/gms-src-v1.4.0 && go test ./internal/stream/
